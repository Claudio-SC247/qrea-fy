name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  sast-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Auditar dependencias (pip-audit)
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output audit.json
          pip-audit -r requirements.txt --format markdown >> "$GITHUB_STEP_SUMMARY"
          exit_code=$?
          set -e
          exit $exit_code

      - name: Subir reporte de auditoría (Artifact)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-pip-audit
          path: audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: Escanear código (Bandit SAST)
        run: |
          bandit -r api/ \
            --severity-level medium \
            --skip B104
